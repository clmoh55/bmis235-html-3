<body>

<nav>
  <a href="index.html"><img src="img/home.png" alt="Base Lodge"></a>
  <a href="schweitzer.html"><img src="img/schweitzer.png" alt="Schweitzer Bowls"></a>
  <a href="spokane.html"><img src="img/mtspokane.png" alt="Spokane Nights"></a>
  <a href="fortynine.html"><img src="img/49degrees.png" alt="49 North Glades"></a>
</nav>

<h1>Schweitzer Mountain Resort</h1>

<div class="resort-detail">
  <div class="mountain-grid">
    <div>
      <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 800 500' width='100%' height='100%'><defs><linearGradient id='sky' x1='0' y1='0' x2='0' y2='1'><stop offset='0%' stop-color='%230f172a'/><stop offset='60%' stop-color='%231e3a8a'/><stop offset='100%' stop-color='%2338bdf8'/></linearGradient><linearGradient id='snow' x1='0' y1='0' x2='0' y2='1'><stop offset='0%' stop-color='%23ffffff'/><stop offset='100%' stop-color='%23e2e8f0'/></linearGradient></defs><rect width='800' height='500' fill='url(%23sky)'/><polygon points='0,500 150,220 300,380 450,160 650,420 800,200 800,500' fill='%231e293b'/><polygon points='150,220 200,280 120,280' fill='url(%23snow)'/><polygon points='450,160 510,240 400,240' fill='url(%23snow)'/><polygon points='800,200 800,280 730,280' fill='url(%23snow)'/><polygon points='0,500 0,350 250,500' fill='url(%23snow)'/><polygon points='200,500 500,320 800,500' fill='url(%23snow)'/><g fill='%23064e3b'><polygon points='80,480 95,440 110,480'/><polygon points='140,490 155,430 170,490'/><polygon points='600,470 615,410 630,470'/><polygon points='680,485 695,425 710,485'/></g><text x='400' y='250' font-family='Arial, sans-serif' font-weight='bold' font-size='28' fill='%23ffffff' text-anchor='middle' opacity='0.95'>Selkirk Deep Powder Bowls &amp; Alpine Vistas</text></svg>" alt="Selkirk Deep Powder Bowls &amp; Alpine Vistas" class="mountain-img">
      <p><b>Selkirk Deep Powder Bowls &amp; Alpine Vistas:</b> Breathtaking alpine views.</p>
    </div>
    <div class="stats-box">
      <h2>Resort Stats</h2>
      <ul>
        <li><b>Vertical Drop:</b> 2,400 ft</li>
        <li><b>Skiable Acres:</b> 2,900 acres</li>
        <li><b>Lifts:</b> 10</li>
        <li><b>Average Snowfall:</b> 300 inches</li>
      </ul>
    </div>
  </div>
</div>

<script>
(function generateNavButtons() {
  const buttonConfigs = [
    { href: 'index.html', label: 'BASE LODGE' },
    { href: 'schweitzer.html', label: 'SCHWEITZER BOWLS' },
    { href: 'spokane.html', label: 'SPOKANE NIGHTS' },
    { href: 'fortynine.html', label: '49° NORTH GLADES' }
  ];

  const navImgs = document.querySelectorAll('nav img');
  navImgs.forEach((img, index) => {
    const config = buttonConfigs[index];
    if (!config) return;

    const canvas = document.createElement('canvas');
    canvas.width = 210;
    canvas.height = 50;
    const ctx = canvas.getContext('2d');

    const grad = ctx.createLinearGradient(0, 0, 0, 50);
    grad.addColorStop(0, '#1f2937');
    grad.addColorStop(0.5, '#111827');
    grad.addColorStop(1, '#0f172a');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, 210, 50);

    ctx.lineWidth = 2;
    ctx.strokeStyle = '#38bdf8';
    ctx.beginPath();
    ctx.moveTo(0, 50); ctx.lineTo(0, 0); ctx.lineTo(210, 0);
    ctx.stroke();

    ctx.strokeStyle = '#ec4899';
    ctx.beginPath();
    ctx.moveTo(210, 0); ctx.lineTo(210, 50); ctx.lineTo(0, 50);
    ctx.stroke();

    ctx.strokeStyle = '#334155';
    ctx.strokeRect(3, 3, 204, 44);

    ctx.strokeStyle = 'rgba(56, 189, 248, 0.12)';
    ctx.lineWidth = 1;
    for (let x = 15; x < 210; x += 15) {
      ctx.beginPath(); ctx.moveTo(x, 4); ctx.lineTo(x, 46); ctx.stroke();
    }

    ctx.fillStyle = '#ffffff';
    ctx.shadowColor = '#38bdf8';
    ctx.shadowBlur = 4;
    ctx.font = '900 13px "Segoe UI", Arial, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(config.label, 105, 25);

    img.src = canvas.toDataURL('image/png');
    img.width = 210;
    img.height = 50;
  });
})();
</script>

</body>
</html>
