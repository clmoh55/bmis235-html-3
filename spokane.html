<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="author" content="Christian Mohlenhoff">
    <title>Mt. Spokane Ski & Snowboard Park - 80s Neon Night Shred</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<nav>
  <a href="index.html"><img src="img/home.png" alt="Base Lodge"></a>
  <a href="schweitzer.html"><img src="img/schweitzer.png" alt="Schweitzer Bowls"></a>
  <a href="spokane.html"><img src="img/mtspokane.png" alt="Spokane Nights"></a>
  <a href="fortynine.html"><img src="img/49degrees.png" alt="49 North Glades"></a>
</nav>

<h1>Mt. Spokane Ski &amp; Snowboard Park</h1>

<div class="resort-detail">
  <div class="mountain-grid">
    <div>
      <img src="https://upload.wikimedia.org/wikipedia/commons/e/e4/Night_Skiing_at_Mt._Spokane.jpg" alt="Mt. Spokane Night Skiing" class="mountain-img">
      <p><b>Night Skiing Capital:</b> Extensive illuminated night runs overlooking the Spokane city lights.</p>
    </div>
    <div class="stats-box">
      <h2>Resort Stats</h2>
      <ul>
        <li><b>Vertical Drop:</b> 2,000 ft</li>
        <li><b>Skiable Acres:</b> 1,704 acres</li>
        <li><b>Lifts:</b> 6 Chairlifts</li>
        <li><b>Night Skiing:</b> 16 Illuminated Trails</li>
      </ul>
    </div>
  </div>
</div>

<script>
(function generateNavButtons() {
  const buttonConfigs = [
    { href: 'index.html', label: 'BASE LODGE' },
    { href: 'schweitzer.html', label: 'SCHWEITZER BOWLS' },
    { href: 'spokane.html', label: 'SPOKANE NIGHTS' },
    { href: 'fortynine.html', label: '49° NORTH GLADES' }
  ];

  const navImgs = document.querySelectorAll('nav img');
  navImgs.forEach((img, index) => {
    const config = buttonConfigs[index];
    if (!config) return;

    const canvas = document.createElement('canvas');
    canvas.width = 210;
    canvas.height = 50;
    const ctx = canvas.getContext('2d');

    const grad = ctx.createLinearGradient(0, 0, 0, 50);
    grad.addColorStop(0, '#1f2937');
    grad.addColorStop(0.5, '#111827');
    grad.addColorStop(1, '#0f172a');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, 210, 50);

    ctx.lineWidth = 2;
    ctx.strokeStyle = '#38bdf8';
    ctx.beginPath();
    ctx.moveTo(0, 50); ctx.lineTo(0, 0); ctx.lineTo(210, 0);
    ctx.stroke();

    ctx.strokeStyle = '#ec4899';
    ctx.beginPath();
    ctx.moveTo(210, 0); ctx.lineTo(210, 50); ctx.lineTo(0, 50);
    ctx.stroke();

    ctx.strokeStyle = '#334155';
    ctx.strokeRect(3, 3, 204, 44);

    ctx.strokeStyle = 'rgba(56, 189, 248, 0.12)';
    ctx.lineWidth = 1;
    for (let x = 15; x < 210; x += 15) {
      ctx.beginPath(); ctx.moveTo(x, 4); ctx.lineTo(x, 46); ctx.stroke();
    }

    ctx.fillStyle = '#ffffff';
    ctx.shadowColor = '#38bdf8';
    ctx.shadowBlur = 4;
    ctx.font = '900 13px "Segoe UI", Arial, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(config.label, 105, 25);

    img.src = canvas.toDataURL('image/png');
    img.width = 210;
    img.height = 50;
  });
})();
</script>

</body>
</html>
